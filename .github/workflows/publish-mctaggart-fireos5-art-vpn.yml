name: Publish verified McTaggart Fire OS 5 APK from authenticated chunk transfer
on:
  push:
    paths:
      - 'public-mctaggart-fireos5-art-vpn-source.txt'
      - '.github/workflows/publish-mctaggart-fireos5-art-vpn.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble signed APK from transport branch and verify its hash
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/staging/mctaggart-fireos5-verified-apk
          git checkout FETCH_HEAD -- staged-apk-chunks/
          test "$(find staged-apk-chunks -type f | wc -l)" -eq 39
          APK="McTaggart-FireOS5-Art-VPN-v2-TEST.apk"
          cat staged-apk-chunks/part-* | base64 --decode > "$APK"
          printf '%s  %s\n' "49dfbf1ebb11dd72cfd27fc51b5625e08064e14823cc961585e4925dc202adb5" "$APK" | sha256sum --check
          test "$(wc -c < "$APK")" -eq 22739193
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'assets/private/oracle-firestick.b64'
          echo "Exact signed APK and bundled client profile verified."
      - name: Publish public downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=McTaggart-FireOS5-Art-VPN-v2-TEST.apk
          TAG=mctaggart-fireos5-art-vpn-public-v2
          NOTES="User-authorized public TEST APK. Includes extractable personal WireGuard VPN client configuration. Intended for the owner's old Fire OS 5 Firestick; do not share to strangers. Original stable installations unaffected."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" --target main --prerelease \
              --title "McTaggart Fire OS 5 artwork and VPN v2 TEST" --notes "$NOTES"
          fi
          echo "PUBLIC_APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
          echo "### Public direct APK link" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK" >> "$GITHUB_STEP_SUMMARY"
