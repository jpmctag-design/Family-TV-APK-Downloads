name: Publish McTaggart v0.7.98 public APK

on:
  push:
    branches: [main]
    paths:
      - "publish/mctaggart-v0.7.98/**"
      - ".github/workflows/publish-mctaggart-v0798.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify APK
        run: |
          mkdir -p dist
          cat publish/mctaggart-v0.7.98/McTaggart-Family-TV-v0.7.98-build171-PROJECTOR.apk.b64.part-* | base64 -d > dist/McTaggart-Family-TV-v0.7.98-build171-PROJECTOR.apk
          cp publish/mctaggart-v0.7.98/SHA256SUMS.txt dist/
          cd dist
          sed 's#  dist/#  #' SHA256SUMS.txt | sha256sum -c -
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.7.98-projector"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "McTaggart Family TV v0.7.98" --notes "McTaggart only: 4:3 projector full-screen mode and a rebalanced home header with larger Celtic/Combat tiles, smaller navigation tiles, and clearer date/weather spacing."
          gh release upload "$TAG" dist/McTaggart-Family-TV-v0.7.98-build171-PROJECTOR.apk dist/SHA256SUMS.txt --clobber
